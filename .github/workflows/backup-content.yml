name: backup-content

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Export D1 content to markdown
        run: npm run db:export
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Commit and push changes
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add src/content/blog
          if git diff --staged --quiet; then
            echo "No content changes to back up"
          else
            git commit -m "chore(content): sync markdown backup from d1"
            git pull --rebase origin main
            git push
          fi
